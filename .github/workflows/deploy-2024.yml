name: Build & Deploy the 2024 copy (SSH)

# Publishes the `2024` branch -- a copy of the variant (itself an
# experimental copy of the game) -- to its own subdomain, with its own
# database. It never touches the live game or the variant.
#     gh workflow run deploy-2024.yml --ref 2024
#     gh run watch
on:
  push:
    branches: [ '2024' ]
  workflow_dispatch:

env:
  # The subdomain this install serves. Used for the rsync target path and
  # the post-deploy OPcache flush. Change in ONE place.
  SUBDOMAIN: 2024.davidsbennett.com
  # The OPcache flush token is the OPCACHE_TOKEN Actions secret. Never put
  # it here: this repository is public.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse anything but the 2024 branch
        run: |
          test "$GITHUB_REF" = "refs/heads/2024" || { echo "deploy-2024.yml publishes the 2024 branch only (got $GITHUB_REF)"; exit 1; }

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # THE LINT GATE. There is no local PHP runtime, so this is the only
      # thing standing between a stray apostrophe in a single-quoted string
      # and a 500 on every page of the live site. Never make it non-blocking.
      - name: Lint PHP (parse check every backend file)
        run: |
          for f in backend/*.php; do
            php -l "$f" > /dev/null || { echo "PARSE ERROR in $f"; php -l "$f"; exit 1; }
          done
          echo "All backend PHP files parse cleanly."

      # The cards the engine plays are generated from docs/*-dc.csv. A CSV
      # edited without rerunning tools/export_cards_php.py fails here.
      - name: Check backend/cards_dc.php matches the content spreadsheets
        run: python3 -X utf8 tools/export_cards_php.py --check

      # The 2024 game's cards come from docs/deck-2024.csv and
      # docs/states-2024.csv (tools/export_cards_2024_php.py).
      - name: Check backend/cards_2024.php matches the 2024 spreadsheets
        run: python3 -X utf8 tools/export_cards_2024_php.py --check

      - name: Install & build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Assemble publish/
        run: |
          mkdir -p publish
          cp -r frontend/dist/. publish/
          cp backend/*.php publish/
          # dbConfig.php and uploads/ are intentionally absent — they live
          # only on the server and are excluded from the rsync below too.

          # The OPcache token exists only in the published docroot, written
          # here from the secret. Fail loudly rather than deploy a flush
          # endpoint that silently refuses every request.
          test -n "$OPCACHE_TOKEN" || { echo "OPCACHE_TOKEN secret is not set"; exit 1; }
          printf "<?php return '%s';\n" "$OPCACHE_TOKEN" > publish/_opcache_token.php
          ls -la publish/
        env:
          OPCACHE_TOKEN: ${{ secrets.OPCACHE_TOKEN }}

      - name: Deploy via SSH (rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST:     ${{ secrets.SSH_HOST }}
          REMOTE_USER:     ${{ secrets.SSH_USERNAME }}
          REMOTE_PORT:     ${{ secrets.SSH_PORT }}
          SOURCE: "publish/"
          TARGET: "public_html/${{ env.SUBDOMAIN }}/"
          # NO --delete: server-only files are never removed by a deploy.
          ARGS: "-rltgoDzvO --no-perms"
          EXCLUDE: "dbConfig.php, uploads/"
          # LiteSpeed serves new static assets immediately but can keep
          # running stale compiled PHP. Flush it or the deploy is a lie.
          # _diag.php was removed from the repo because the token guarding
          # it was published; rsync never deletes, so remove it here too.
          SCRIPT_AFTER: |
            rm -f "$HOME/public_html/${{ env.SUBDOMAIN }}/_diag.php"
            curl -s "https://${{ env.SUBDOMAIN }}/_opcache_reset.php?token=${{ secrets.OPCACHE_TOKEN }}" >/dev/null 2>&1 || true

      - name: Smoke check the live install
        run: |
          echo "Schema check:"
          curl -s --max-time 30 "https://${{ env.SUBDOMAIN }}/admin_schemaCheck.php" || true
          echo
